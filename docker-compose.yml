services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Runs once and exits: applies the migrations. The app waits for it to finish successfully.
  migrate:
    build: .
    command: ["bun", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Every replica runs all four roles. The host port is a range (default 3101-3110, up to 10 replicas),
  # so `--scale app=3` does not collide: `docker compose ps app` shows the port each replica got.
  app:
    build: .
    environment:
      APP_PORT: 3100
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
    ports:
      - "${APP_HOST_PORTS:-3101-3110}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3100/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  # Single entry point on host port 3100, round-robin over the `app` replicas (internal port 3100).
  # Direct access to each replica stays available on the 3101-3110 range.
  lb:
    image: nginx:1.27.5-alpine
    ports:
      - "3100:3100"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
