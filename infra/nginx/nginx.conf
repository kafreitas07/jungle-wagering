# Round-robin load balancer in front of the `app` replicas (see the `lb` service in docker-compose.yml).
# The application is untouched: the replicas keep listening on 3100 inside the compose network.

events {}

http {
  # Docker's embedded DNS returns one A record per replica of `app`. Using a variable in proxy_pass makes nginx
  # re-resolve it every few seconds, so replicas that are restarted or scaled show up without restarting the lb.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 3100;

    location / {
      set $app_upstream http://app:3100;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout;
    }
  }
}
